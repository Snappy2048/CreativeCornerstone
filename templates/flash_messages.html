<style>
    .flash-messages { list-style:none; padding:0; margin:0; position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:9999; width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center; gap:10px; pointer-events:none; }
    .flash-message { font-family:"Inter",system-ui,sans-serif; background:rgba(20,20,32,.92); color:#f2f3f8; border:1px solid rgba(255,255,255,.14); border-left:4px solid #8b5cf6; backdrop-filter:blur(14px); padding:13px 18px; border-radius:14px; box-shadow:0 18px 40px -16px rgba(0,0,0,.6); width:fit-content; max-width:92%; display:flex; align-items:center; justify-content:space-between; gap:14px; pointer-events:auto; animation:flashIn .35s cubic-bezier(.22,.8,.27,1); }
    .flash-message.success { border-left-color:#22c55e; }
    .flash-message.error, .flash-message.danger { border-left-color:#ef4444; }
    .flash-message.warning { border-left-color:#f59e0b; }
    .flash-message.info { border-left-color:#3b82f6; }
    .flash-message .close-btn { cursor:pointer; font-size:20px; line-height:1; color:#a0a3b8; flex-shrink:0; }
    .flash-message .close-btn:hover { color:#fff; }
    @keyframes flashIn { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:none; } }
</style>
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<ul class="flash-messages">
    {% for category, message in messages %}
    <li class="flash-message {{ category }}"><span class="message-text">{{ message }}</span><span class="close-btn">&times;</span></li>
    {% endfor %}
</ul>
{% endif %}
{% endwith %}
<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".flash-message").forEach(function (msg) {
            var close = msg.querySelector(".close-btn");
            function fade() { msg.style.transition = "opacity .4s, transform .4s"; msg.style.opacity = "0"; msg.style.transform = "translateY(-10px)"; setTimeout(function () { msg.remove(); }, 400); }
            close.addEventListener("click", fade);
            setTimeout(fade, 3500);
        });
    });
</script>
